name: build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  allmodconfig:
    name: allmodconfig
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: bash work/pipelines/scripts/ci-cleanup.sh

      - name: Install dependencies
        run: bash work/pipelines/scripts/deps.sh ci

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-allmodconfig-${{ github.sha }}
          restore-keys: |
            ccache-allmodconfig-

      - name: Build allmodconfig
        env:
          JOBS: "4"
          MIN_FREE_GB: "8"
          CCACHE_MAXSIZE: "4G"
        run: bash work/pipelines/scripts/build.sh

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-primary-key != '' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Upload config
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allmodconfig-config
          path: work/build/allmodconfig/.config
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allmodconfig-log
          path: work/build/allmodconfig/build.log
          if-no-files-found: ignore
