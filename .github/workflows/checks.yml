name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checkpatch:
    name: checkpatch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: bash work/pipelines/scripts/deps.sh check

      - name: Run checkpatch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          base_ref="${GITHUB_BASE_REF:-master}"
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          export BASE="origin/${base_ref}"
          bash work/pipelines/scripts/checkpatch.sh

  sparse:
    name: sparse
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: bash work/pipelines/scripts/ci-cleanup.sh

      - name: Install dependencies
        run: bash work/pipelines/scripts/deps.sh ci

      - name: Build sparse
        run: |
          git clone --depth=1 https://git.kernel.org/pub/scm/devel/sparse/sparse.git /tmp/sparse
          make -C /tmp/sparse -j"$(nproc)"
          echo "/tmp/sparse" >> "$GITHUB_PATH"

      - name: Run sparse
        env:
          JOBS: "4"
        run: bash work/pipelines/scripts/sparse.sh

      - name: Upload sparse log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparse-log
          path: |
            work/build/sparse/sparse.log
            work/build/sparse/summary.txt
          if-no-files-found: ignore
