name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checkpatch:
    name: checkpatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install perl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends perl

      - name: Run checkpatch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "${GITHUB_BASE_REF}" ]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}"
            export BASE="origin/${GITHUB_BASE_REF}"
          else
            export BASE="origin/master"
          fi
          bash work/pipelines/scripts/checkpatch.sh

  sparse:
    name: sparse
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: bash work/pipelines/scripts/ci-cleanup.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves cpio kmod

      - name: Build sparse
        run: |
          git clone --depth=1 https://git.kernel.org/pub/scm/devel/sparse/sparse.git /tmp/sparse
          make -C /tmp/sparse -j"$(nproc)"
          echo "/tmp/sparse" >> "$GITHUB_PATH"

      - name: Run sparse
        env:
          JOBS: "4"
        run: bash work/pipelines/scripts/sparse.sh

      - name: Upload sparse log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparse-log
          path: |
            work/build/sparse/sparse.log
            work/build/sparse/summary.txt
          if-no-files-found: ignore
