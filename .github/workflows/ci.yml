name: kernel-ci

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: meta
    uses: ./.github/workflows/meta.yml

  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  security:
    name: security
    uses: ./.github/workflows/security.yml

  build:
    name: build
    uses: ./.github/workflows/build.yml

  kunit:
    name: kunit
    uses: ./.github/workflows/kunit.yml

  smoke:
    name: smoke
    uses: ./.github/workflows/smoke.yml

  ternary:
    name: ternary
    uses: ./.github/workflows/ternary.yml
