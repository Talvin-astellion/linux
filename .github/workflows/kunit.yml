name: kunit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  kunit:
    name: kunit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: bash work/pipelines/scripts/deps.sh ci

      - name: Run KUnit
        env:
          JOBS: "4"
          KUNIT_TIMEOUT: "600"
        run: bash work/pipelines/scripts/kunit.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kunit-results
          path: |
            work/build/kunit/kunit.json
            work/build/kunit/*.log
          if-no-files-found: ignore
