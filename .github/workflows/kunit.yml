name: kunit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  kunit:
    name: kunit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves cpio kmod python3

      - name: Run KUnit
        env:
          JOBS: "4"
          KUNIT_TIMEOUT: "600"
        run: bash work/pipelines/scripts/kunit.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunit-results
          path: |
            work/build/kunit/kunit.json
            work/build/kunit/*.log
          if-no-files-found: ignore
