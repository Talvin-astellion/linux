name: meta

on:
  workflow_call:

permissions:
  contents: read

jobs:
  meta:
    name: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: bash work/pipelines/scripts/deps.sh lint

      - name: Lint shell and workflows
        run: bash work/pipelines/scripts/lint.sh

      - name: Check metrics are current
        run: bash work/pipelines/scripts/metrics.sh --check
