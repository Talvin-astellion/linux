name: smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qemu:
    name: qemu-smoke
    # ubuntu-latest migrated to Ubuntu 26.04 (QEMU 10.2.1), where the
    # defconfig bzImage triple-faults before console output. Pin this job
    # until the 26.04 root cause is understood (see ISSUE-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: bash work/pipelines/scripts/deps.sh smoke

      - name: Build defconfig
        env:
          JOBS: "4"
        run: |
          make O=work/build/defconfig defconfig
          make O=work/build/defconfig -j"${JOBS}"

      - name: Run QEMU smoke
        run: bash work/pipelines/scripts/smoke-qemu.sh

      - name: Upload QEMU log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qemu-smoke-log
          path: |
            work/build/smoke/qemu.log
            work/build/smoke/qemu-debug.log
          if-no-files-found: ignore

      - name: Upload kernel image on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qemu-smoke-bzImage
          path: work/build/defconfig/arch/x86/boot/bzImage
          if-no-files-found: ignore
