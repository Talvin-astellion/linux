name: kernel-ci

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  build:
    name: build
    uses: ./.github/workflows/build.yml

  kunit:
    name: kunit
    uses: ./.github/workflows/kunit.yml
